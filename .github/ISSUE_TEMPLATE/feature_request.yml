name: Feature request
description: Suggest an improvement for XMApp
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the suggestion. Please do not include passwords, serial
        numbers, IP addresses, or camera footage.
  - type: textarea
    id: problem
    attributes:
      label: What problem would this solve?
      description: Describe the situation where the current app is inconvenient.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: What should the app do instead?
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
  - type: input
    id: platform
    attributes:
      label: Platform
      placeholder: "iOS, Android, or both"
    validations:
      required: false
